# Builds Codeleaf for macOS, Windows and Linux on GitHub's machines.
# - Push a tag like v1.0.2  -> builds everything and publishes a GitHub Release.
# - "Run workflow" button    -> builds everything and keeps the files as downloadable artifacts.
name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --mac --arm64 --x64
          - name: Windows
            os: windows-latest
            args: --win --x64 --arm64
          - name: Linux
            os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      # macOS signing: add these repository secrets (Settings → Secrets and variables → Actions)
      # once you have an Apple Developer account, and the "unverified developer" warning disappears:
      #   MAC_CERT_P12_BASE64      Developer ID Application certificate (.p12), base64-encoded
      #   MAC_CERT_PASSWORD        password of that .p12
      #   APPLE_ID                 your Apple ID e-mail
      #   APPLE_APP_PASSWORD       app-specific password from appleid.apple.com
      #   APPLE_TEAM_ID            10-character team ID
      # Without them the Mac app is ad-hoc signed, exactly as before.
      - name: Build installers
        shell: bash
        run: |
          ARGS="${{ matrix.args }} --publish never"
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$CSC_LINK" ]; then
              echo "Signing with Developer ID"
              ARGS="$ARGS -c.mac.hardenedRuntime=true -c.mac.entitlements=build/entitlements.mac.plist -c.mac.entitlementsInherit=build/entitlements.mac.plist"
              if [ -n "$APPLE_ID" ]; then ARGS="$ARGS -c.mac.notarize=true"; echo "Notarizing with Apple"; fi
            else
              echo "No Apple certificate configured: ad-hoc signing"
              ARGS="$ARGS -c.mac.identity=null"
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              unset CSC_LINK CSC_KEY_PASSWORD
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          npx electron-builder $ARGS
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Smoke-test the Windows build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          printf 'function hello() {\n  return 42;\n}\n' > "$RUNNER_TEMP/smoke/sample.js"
          CODELEAF_SMOKE="$RUNNER_TEMP/smoke" timeout 90 ./dist/win-unpacked/Codeleaf.exe "$RUNNER_TEMP/smoke/sample.js" || true
          test -s "$RUNNER_TEMP/smoke/shot.png" && echo "Windows build started and rendered correctly"

      - uses: actions/upload-artifact@v4
        with:
          name: codeleaf-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## Download

          | Platform | File |
          |---|---|
          | macOS (Apple Silicon M1–M4) | \`Codeleaf-${VERSION}-arm64.dmg\` |
          | macOS (Intel) | \`Codeleaf-${VERSION}-x64.dmg\` |
          | Windows (64-bit and ARM) | \`Codeleaf-Setup-${VERSION}.exe\` |
          | Linux | \`Codeleaf-${VERSION}-x86_64.AppImage\` |

          **Easiest on macOS** (installs the right version with no security prompt), paste into Terminal:
          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash
          \`\`\`

          **If you download the .dmg instead:** macOS may say it "could not verify Codeleaf is free of malware" because the app is not yet notarized by Apple.
          Open it once, then go to *System Settings → Privacy & Security* and click **Open Anyway**. Updates after that install themselves.
          Windows: if SmartScreen appears, click *More info → Run anyway*.
          Linux: \`chmod +x\` the AppImage, then run it.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Codeleaf $VERSION" \
            --notes-file notes.md \
            --generate-notes
