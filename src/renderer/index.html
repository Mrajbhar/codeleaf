<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codeleaf</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toolbar" role="toolbar"></div>
  <div id="main">
    <aside id="sidebar" hidden>
      <div class="side-tabs" role="tablist">
        <button class="side-tab" data-panel="files" role="tab">Workspace</button>
        <button class="side-tab" data-panel="outline" role="tab">Function List</button>
      </div>
      <div class="side-header" data-for="files">
        <span id="side-title">Folder as Workspace</span>
        <span class="side-actions">
          <button data-side="open" title="Open folder">📂</button>
          <button data-side="refresh" title="Refresh">⟳</button>
          <button data-side="collapse" title="Collapse all">⊟</button>
          <button data-side="close" title="Close panel">✕</button>
        </span>
      </div>
      <div id="tree" tabindex="0" data-for="files"></div>
      <div class="side-header" data-for="outline">
        <input id="outline-filter" type="search" placeholder="Filter functions…" spellcheck="false">
        <span class="side-actions">
          <button data-outline="sort" title="Sort A–Z / by position">⇅</button>
          <button data-side="close" title="Close panel">✕</button>
        </span>
      </div>
      <div id="outline" tabindex="0" data-for="outline"></div>
    </aside>
    <div id="sidebar-resizer" class="resizer-v" hidden></div>
    <section id="center">
      <div id="views">
        <section class="view focused" data-view="0">
          <div class="tabbar">
            <div class="tabs" role="tablist"></div>
            <button class="tab-new" title="New tab">+</button>
          </div>
          <div class="editor-host"></div>
        </section>
        <div id="views-resizer" class="resizer-v" hidden></div>
        <section class="view" data-view="1" hidden>
          <div class="tabbar">
            <div class="tabs" role="tablist"></div>
            <button class="tab-new" title="New tab">+</button>
          </div>
          <div class="editor-host"></div>
        </section>
        <div id="preview-resizer" class="resizer-v" hidden></div>
        <section id="preview" hidden>
          <div class="preview-header">
            <span id="preview-title">Preview</span>
            <span class="side-actions">
              <button data-preview="sync" title="Scroll with the editor">⇅</button>
              <button data-preview="close" title="Close preview">✕</button>
            </span>
          </div>
          <iframe id="preview-frame" sandbox="allow-same-origin" title="Preview"></iframe>
          <div id="preview-empty" hidden></div>
        </section>
      </div>
      <section id="compare" hidden>
        <div class="compare-bar">
          <span class="cmp-badge">Compare</span>
          <span id="cmp-title"></span>
          <span id="cmp-count"></span>
          <span class="compare-actions">
            <button class="btn small" data-cmp="comparePrev" title="Previous difference (Shift+F8)">▲ Prev</button>
            <button class="btn small" data-cmp="compareNext" title="Next difference (F8)">▼ Next</button>
            <button class="btn small" data-cmp="compareToggleMode" title="Switch between side-by-side and inline">Side by side / Inline</button>
            <button class="btn small" data-cmp="compareSwap" title="Swap left and right">⇄ Swap</button>
            <button class="btn small primary" data-cmp="compareClose" title="Close compare">✕ Close</button>
          </span>
        </div>
        <div id="compare-host"></div>
      </section>
      <div id="results-resizer" class="resizer-h" hidden></div>
      <section id="results" hidden>
        <div class="results-header">
          <span id="results-title">Search results</span>
          <span class="side-actions">
            <button data-results="collapse" title="Collapse all">⊟</button>
            <button data-results="clear" title="Clear">⌫</button>
            <button data-results="close" title="Close">✕</button>
          </span>
        </div>
        <div id="results-body" tabindex="0"></div>
      </section>
    </section>
  </div>
  <footer id="statusbar">
    <span id="sb-lang" class="sb-item clickable" title="Change language"></span>
    <span id="sb-size" class="sb-item"></span>
    <span id="sb-pos" class="sb-item"></span>
    <span id="sb-words" class="sb-item" title="Word count"></span>
    <span class="sb-spacer"></span>
    <span id="sb-macro" class="sb-item" hidden>● REC</span>
    <span id="sb-indent" class="sb-item clickable" title="Indentation"></span>
    <span id="sb-eol" class="sb-item clickable" title="Change end of line"></span>
    <span id="sb-enc" class="sb-item clickable" title="Change encoding"></span>
    <span id="sb-mode" class="sb-item"></span>
  </footer>
  <div id="modal-root"></div>
  <div id="loading">Loading…</div>

  <!-- marked must load before Monaco's AMD loader so it registers as a global -->
  <script src="../../node_modules/marked/lib/marked.umd.js"></script>
  <script src="../../node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
